<style>
  :root{ color-scheme: light; }
  html{ scroll-behavior:smooth; }
  body{ font-family:'IBM Plex Sans Arabic','Inter', sans-serif; background:#FAFAF8; color:#0C0C0D; }
  h1,h2,h3,.font-display{ font-family:'Almarai','Inter', sans-serif; }
  html[lang="en"] body{ font-family:'Inter', sans-serif; }
  html[lang="en"] h1, html[lang="en"] h2, html[lang="en"] h3, html[lang="en"] .font-display{ font-family:'Inter', sans-serif; }
  ::selection{ background:#F7E600; color:#0C0C0D; }
  :focus-visible{ outline:2px solid #0C0C0D; outline-offset:3px; border-radius:6px; }

  .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:700; letter-spacing:.3px; color:#54534B; }
  .eyebrow .dot{ width:7px; height:7px; border-radius:50%; background:#F7E600; box-shadow:0 0 0 4px rgba(247,230,0,.25); }

  .btn-primary{ background:#0C0C0D; color:#fff; transition:.25s; }
  .btn-primary:hover{ background:#242426; transform:translateY(-2px); box-shadow:0 14px 30px rgba(12,12,13,.18); }
  .btn-yellow{ background:#F7E600; color:#0C0C0D; transition:.25s; }
  .btn-yellow:hover{ background:#FFF046; transform:translateY(-2px); box-shadow:0 14px 30px rgba(247,230,0,.35); }
  .btn-ghost{ background:#fff; color:#0C0C0D; border:1px solid #E7E6E2; transition:.25s; }
  .btn-ghost:hover{ background:#F3F2EE; }

  .card-hover{ transition:.3s; }
  .card-hover:hover{ transform:translateY(-4px); box-shadow:0 20px 40px rgba(12,12,13,.08); border-color:#D9D8D2; }

  /* Terminal mock */
  .terminal{ background:#0F0F10; border:1px solid #232326; border-radius:20px; overflow:hidden; box-shadow:0 30px 70px rgba(12,12,13,.35); }
  .traffic i{ display:inline-block; width:9px; height:9px; border-radius:50%; background:#3A3A3D; margin-inline-end:6px; }
  .term-body{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; direction:rtl; text-align:right; color:#E9E9EA; font-size:12.5px; line-height:2; padding:20px; min-height:260px; }
  .term-body.ltr{ direction:ltr; text-align:left; }
  .term-line{ opacity:0; transform:translateY(4px); animation:reveal .5s forwards; }
  .term-line:nth-child(1){ animation-delay:.2s }
  .term-line:nth-child(2){ animation-delay:.7s }
  .term-line:nth-child(3){ animation-delay:1.2s }
  .term-line:nth-child(4){ animation-delay:1.9s }
  .term-line:nth-child(5){ animation-delay:2.5s }
  .term-line:nth-child(6){ animation-delay:3.1s }
  @keyframes reveal{ to{ opacity:1; transform:translateY(0); } }
  .cursor{ display:inline-block; width:7px; height:14px; background:#F7E600; vertical-align:-2px; animation:blink 1s step-end infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .toast-mini{ animation:toastLoop 5s ease-in-out infinite; }
  @keyframes toastLoop{
    0%,60%{ opacity:0; transform:translateY(6px); }
    68%,88%{ opacity:1; transform:translateY(0); }
    96%,100%{ opacity:0; transform:translateY(6px); }
  }

  .brand-logo{ width:92px; height:42px; border-radius:11px; object-fit:contain; background:#000; display:block; }
  .footer-logo{ width:88px; height:40px; border-radius:10px; object-fit:contain; background:#000; display:block; }

  .icon-tile{ width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-size:18px; background:#FFF9B0; color:#5B5300; border:1px solid #F0E9A0; }

  .reveal-up{ opacity:0; transform:translateY(18px); transition:opacity .6s ease, transform .6s ease; }
  .reveal-up.in{ opacity:1; transform:translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .term-line{ animation:none !important; opacity:1 !important; transform:none !important; }
    .cursor{ animation:none !important; }
    .toast-mini{ animation:none !important; opacity:0; }
    .reveal-up{ transition:none !important; opacity:1 !important; transform:none !important; }
  }


  .workspace-embed{width:100%;position:relative}
  .workspace-embed iframe{width:100%;display:block;border:0;background:transparent}

  #mobileMenu{ transform:translateY(-8px); opacity:0; pointer-events:none; transition:.2s; }
  #mobileMenu.open{ transform:translateY(0); opacity:1; pointer-events:auto; }
</style>

    let lang = (()=>{try{return localStorage.getItem('hrschool-lang')==='en'?'en':'ar'}catch(e){return 'ar'}})();

    function applyLang(syncApp = true){
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.title = lang === 'ar' ? 'HR School — مساحة أوامر الموارد البشرية' : 'HR School — HR Prompt Workspace';
      document.getElementById('metaDesc').setAttribute('content', lang === 'ar'
        ? 'أوامر AI احترافية جاهزة لكل مهمة HR. اختر الوظيفة، حدد المهمة، وانسخ الأمر في ثوانٍ.'
        : 'Professional AI prompts ready for every HR task. Pick the function, choose the task, copy the prompt in seconds.');
      document.getElementById('langBtn').textContent = lang === 'ar' ? 'EN' : 'عربي';
      document.getElementById('termBody').classList.toggle('ltr', lang === 'en');

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[key]) el.innerHTML = translations[key][lang];
      });
      try { localStorage.setItem('hrschool-lang', lang); } catch(e) {}
      if (syncApp) sendLanguageToApp();
    }

    document.getElementById('langBtn').addEventListener('click', () => {
      lang = lang === 'ar' ? 'en' : 'ar';
      applyLang();
    });

    // mobile menu toggle
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    menuBtn.addEventListener('click', () => mobileMenu.classList.toggle('open'));
    document.querySelectorAll('#mobileMenu a').forEach(a => a.addEventListener('click', () => mobileMenu.classList.remove('open')));

    // scroll reveal
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal-up').forEach(el => io.observe(el));

    const appFrame = document.getElementById('appFrame');
    function sendLanguageToApp(){
      if(appFrame && appFrame.contentWindow){
        appFrame.contentWindow.postMessage({type:'hrschool-language',lang},'*');
      }
    }
